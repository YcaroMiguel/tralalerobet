<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Caça-níquel - TralaleroBet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="top-bar">
      <div class="logo-container">
        <a href="./tralalerobet/index.html"><img src="./images/logo.png" alt="Logo TralaleroBet"></a>
        <span class="logo-text">TralaleroBet</span>
      </div>
    </header>
  
    <div class="slot-machine">
        <h1>🎰 TralaleroBet Slots</h1>
      
        <div class="info-panel">
          <p><strong>Moedas:</strong> <span id="coins">1000</span></p>
          <label for="betAmount">Aposta:</label>
          <select id="betAmount">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
      
        <div class="reels">
          <div class="reel" id="reel1"></div>
          <div class="reel" id="reel2"></div>
          <div class="reel" id="reel3"></div>
        </div>
      
        <button id="spinButton">Girar</button>
        <p id="result"></p>
      </div>      
  
    <script src="script.js"></script>
</body>  
</html>
